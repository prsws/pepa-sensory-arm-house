name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta'
      - 'v*.*.*-alpha'
      - 'v*.*.*-rc*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "tag_version=$TAG" >> $GITHUB_OUTPUT
          echo "Tag version: $TAG"

      - name: Extract version from manifest
        id: extract_manifest
        run: |
          MANIFEST_VERSION=$(jq -r '.version' custom_components/pepa_sensory_arm_house/manifest.json)
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "Manifest version: $MANIFEST_VERSION"

      - name: Validate version match
        run: |
          TAG_VERSION="${{ steps.extract_version.outputs.tag_version }}"
          MANIFEST_VERSION="${{ steps.extract_manifest.outputs.manifest_version }}"

          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "❌ Error: Tag version ($TAG_VERSION) does not match manifest.json version ($MANIFEST_VERSION)"
            echo "Please update manifest.json to version $TAG_VERSION before creating the release."
            exit 1
          fi

          echo "✓ Version validation passed: $TAG_VERSION"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "tag_version=$TAG" >> $GITHUB_OUTPUT
          echo "Version: $TAG"

      - name: Determine if pre-release
        id: prerelease
        run: |
          VERSION="${{ steps.extract_version.outputs.tag_version }}"
          if [[ $VERSION =~ -(beta|alpha|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "This is a pre-release version"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "This is a stable release"
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, generating full changelog"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Generating changelog since $PREV_TAG"
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Save changelog to file
          echo "$CHANGELOG" > CHANGELOG.tmp
          echo "changelog_file=CHANGELOG.tmp" >> $GITHUB_OUTPUT

      - name: Create Release Notes
        run: |
          VERSION="${{ steps.extract_version.outputs.tag_version }}"
          IS_PRERELEASE="${{ steps.prerelease.outputs.is_prerelease }}"

          cat > RELEASE_NOTES.md << EOF
          # Pepa Sensory Arm House v$VERSION

          $(if [ "$IS_PRERELEASE" = "true" ]; then echo "**⚠️ This is a pre-release version**"; echo ""; fi)
          ## What's Changed

          $(cat CHANGELOG.tmp)

          ## Installation

          ### Home Assistant Marketplace

          1. Marketplace → Pepa Sensory Arm House → Install another version
          2. Choose \`v$VERSION\`, then restart Home Assistant

          ### Manual

          1. Download \`pepa-sensory-arm-house-$VERSION.zip\` below
          2. Extract it into \`config/custom_components/\` (it creates \`pepa_sensory_arm_house/\`)
          3. Restart Home Assistant and add the Pepa Sensory Arm House integration

          ## Documentation

          https://github.com/${{ github.repository }}/tree/v$VERSION/docs

          ## Requirements

          - Home Assistant 2026.11.0 or later
          - Python 3.14
          EOF

      - name: Create Release ZIP
        run: |
          VERSION="${{ steps.extract_version.outputs.tag_version }}"
          mkdir -p dist
          cd custom_components
          zip -r ../dist/pepa-sensory-arm-house-$VERSION.zip pepa_sensory_arm_house/ -x '*/__pycache__/*'
          cd ..

      # Attach only the zip. Attaching each file fails: several share a name (__init__.py).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: false
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-hacs:
    name: Validate HACS Compatibility
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
